<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕐 坤时转换器 · 小黑子的专属计时器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    padding: 20px;
  }

  /* 飘落的篮球动画 */
  .bg-basketball {
    position: fixed;
    font-size: 30px;
    opacity: 0.08;
    animation: fall linear infinite;
    z-index: 0;
    pointer-events: none;
  }
  @keyframes fall {
    0%   { transform: translateY(-10vh) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 980px;
    width: 100%;
    text-align: center;
  }

  /* 标题 */
  .title {
    font-size: 42px;
    font-weight: 900;
    background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 3s ease infinite;
    margin-bottom: 5px;
    cursor: pointer;
    user-select: none;
  }
  @keyframes rainbow { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }

  .subtitle {
    color: #8899aa;
    font-size: 15px;
    margin-bottom: 30px;
    letter-spacing: 2px;
  }

  /* 时钟显示 */
  .clock-bar {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 18px 30px;
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    backdrop-filter: blur(10px);
  }
  .clock-bar .label { color:#8899aa; font-size:14px; }
  .clock-bar .time {
    font-size: 36px;
    font-weight: 800;
    color: #feca57;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 20px rgba(254,202,87,0.5);
  }
  .clock-bar .sec { font-size: 20px; color: #ff6b6b; }
  .clock-bar .date { color: #8899aa; font-size: 14px; margin-left: 6px; }

  /* 卡片 */
  .cards {
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 30px;
  }

  .card {
    flex: 1;
    min-width: 300px;
    border-radius: 24px;
    padding: 30px 25px;
    position: relative;
    overflow: hidden;
    transition: transform 0.3s;
  }
  .card:hover { transform: translateY(-5px); }

  .card .avatar { font-size: 55px; margin-bottom: 10px; display: block; }
  .card .name { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 3px; }
  .card .name .tag {
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.65);
    background: rgba(0,0,0,0.22);
    border-radius: 999px;
    padding: 2px 8px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .card .off-time { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 20px; }
  .card .off-time .range { display: block; font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 4px; }

  /* 倒计时 */
  .countdown {
    font-size: 52px;
    font-weight: 900;
    font-family: 'Courier New', monospace;
    line-height: 1.1;
    margin-bottom: 5px;
  }
  .countdown-label { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 15px; }

  /* 坤时 */
  .kun-box {
    background: rgba(0,0,0,0.25);
    border-radius: 16px;
    padding: 15px;
    margin-top: 10px;
  }
  .kun-value { font-size: 38px; font-weight: 900; text-shadow: 0 0 20px rgba(255,159,243,0.6); }
  .kun-unit { font-size: 16px; color: rgba(255,255,255,0.7); }
  .kun-hint { font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 6px; }

  /* 状态文案 */
  .status-msg {
    font-size: 15px;
    font-weight: 600;
    margin-top: 12px;
    min-height: 22px;
    color: rgba(255,255,255,0.85);
  }

  /* 底部搞笑文案 */
  .footer-joke {
    margin-top: 10px;
    font-size: 16px;
    color: #636e72;
    font-style: italic;
    min-height: 24px;
    transition: color 0.5s, opacity 0.3s;
  }
  .footer-joke.highlight { color: #feca57; }

  /* 进度条 */
  .progress-wrap {
    margin-top: 15px;
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
    height: 10px;
    overflow: hidden;
  }
  .progress-bar { height: 100%; border-radius: 10px; transition: width 1s linear; }

  /* 说明 */
  .formula-box {
    background: rgba(255,255,255,0.03);
    border: 1px dashed rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 16px 22px;
    margin-top: 25px;
    color: #8899aa;
    font-size: 14px;
    line-height: 1.8;
  }
  .formula-box b { color: #feca57; }

  /* 已下班提示 */
  .after-work {
    font-size: 30px;
    font-weight: 900;
    color: #ff6b6b;
    text-shadow: 0 0 20px rgba(255,107,107,0.6);
    animation: pulse 1s ease infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.7;transform:scale(1.05)} }

  .confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }

  /* ===== 按钮 ===== */
  .btn {
    cursor: pointer;
    border: none;
    font-family: inherit;
    font-size: 14px;
    border-radius: 10px;
    padding: 9px 16px;
    transition: transform 0.15s, opacity 0.15s;
    color: #fff;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }
  .btn-primary { background: linear-gradient(135deg, #ff6b6b, #feca57); color: #222; font-weight: 700; }
  .btn-ghost { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
  .btn-danger { background: rgba(214,48,49,0.85); }
  .btn-add { background: rgba(85,239,196,0.18); border: 1px dashed rgba(85,239,196,0.6); color: #55efc4; width: 100%; padding: 12px; }

  /* 右上角悬浮小工具条：平时半透明，鼠标靠近时才完全显现，尽量不挡视野 */
  .toolbar {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 1100;
    display: flex;
    gap: 8px;
    opacity: 0.35;
    transition: opacity 0.25s;
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: calc(100vw - 28px);
  }
  .toolbar:hover { opacity: 1; }
  .toolbar .btn {
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .toolbar .btn:hover { transform: none; }
  .toolbar #resetBtn { color: #dfe6ee; }
  .toolbar #kunBtn {
    color: #feca57;
    border-color: rgba(254,202,87,0.5);
    background: rgba(254,202,87,0.12);
  }

  /* ===== 设置弹窗 ===== */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 1000;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 30px 15px;
    overflow-y: auto;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: linear-gradient(160deg, #22263a, #1b1f31);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    width: 100%;
    max-width: 720px;
    padding: 25px;
    color: #e8ecf3;
    text-align: left;
  }
  .modal h2 { font-size: 22px; margin-bottom: 4px; }
  .modal .desc { font-size: 13px; color: #8899aa; margin-bottom: 18px; }

  .field { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .field label { font-size: 13px; color: #aab6c6; display: block; margin-bottom: 5px; }
  .field .col { flex: 1; min-width: 120px; }
  input[type=text], input[type=time], input[type=number], select {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    padding: 9px 10px;
    outline: none;
  }
  input:focus, select:focus { border-color: #feca57; }
  select option { background: #22263a; color: #fff; }
  input[type=time]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.6; }

  .person-row {
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
    background: rgba(255,255,255,0.03);
    position: relative;
  }
  .person-row .row-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; font-size: 13px; color: #8899aa;
  }
  .emoji-input { text-align: center; font-size: 20px !important; }

  .modal-actions {
    display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;
    margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1);
  }
  .modal-actions .left { margin-right: auto; }

  .empty-tip { color: #8899aa; font-size: 14px; text-align: center; padding: 20px; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,0.85); color: #fff; padding: 10px 20px; border-radius: 999px;
    font-size: 14px; z-index: 1200; opacity: 0; pointer-events: none; transition: all 0.3s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===================== 🆕 坤坤特效 ===================== */

  /* 点击弹篮球 */
  .pop-ball {
    position: fixed;
    z-index: 1300;
    pointer-events: none;
    line-height: 1;
    transform: translate(-50%, -50%);
    will-change: transform, opacity;
    animation: ballPop 0.95s cubic-bezier(0.2, 0.75, 0.4, 1) forwards;
  }
  @keyframes ballPop {
    0%   { transform: translate(-50%, -50%) scale(0.3) rotate(0deg); opacity: 0; }
    16%  { transform: translate(-50%, -50%) scale(1.18) rotate(80deg); opacity: 1; }
    58%  { transform: translate(calc(-50% + var(--dx) * 0.6), calc(-50% + var(--dy))) scale(1) rotate(320deg); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 190px)) scale(0.8) rotate(680deg); opacity: 0; }
  }

  /* 篮球雨 */
  .rain-ball {
    position: fixed;
    top: -70px;
    z-index: 1150;
    pointer-events: none;
    line-height: 1;
    will-change: transform, opacity;
    animation: rainFall linear forwards;
  }
  @keyframes rainFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    85%  { opacity: 1; }
    100% { transform: translateY(114vh) rotate(760deg); opacity: 0.8; }
  }

  /* 铁山靠：坤坤冲锋 */
  .kun-charge {
    position: fixed;
    top: 50%;
    left: 0;
    z-index: 1250;
    display: flex;
    align-items: center;
    gap: 14px;
    pointer-events: none;
    will-change: transform;
    transform: translate(-340px, -50%);
    animation: kunCharge 1.35s cubic-bezier(0.42, 0, 0.58, 1) forwards;
  }
  @keyframes kunCharge {
    0%   { transform: translate(-340px, -50%); }
    40%  { transform: translate(28vw, -63%); }
    70%  { transform: translate(64vw, -43%); }
    100% { transform: translate(calc(100vw + 340px), -50%); }
  }
  .kun-charge .kun-figure {
    font-size: 60px;
    display: block;
    filter: drop-shadow(0 0 24px rgba(254,202,87,0.95));
    animation: figureSpin 0.42s linear infinite;
  }
  @keyframes figureSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .kun-charge .kun-shout {
    font-size: 30px;
    font-weight: 900;
    white-space: nowrap;
    color: #feca57;
    letter-spacing: 1px;
    text-shadow: 0 0 18px rgba(254,202,87,0.9), 0 0 42px rgba(255,107,107,0.7), 0 3px 0 rgba(0,0,0,0.35);
    transform-origin: left center;
    animation: shoutPulse 0.18s ease-in-out infinite alternate;
  }
  @keyframes shoutPulse {
    from { transform: scale(1) rotate(-3deg); }
    to   { transform: scale(1.12) rotate(3deg); }
  }

  /* 卡片被撞飞 */
  .card.hit { animation: cardHit 0.72s cubic-bezier(.36,.07,.19,.97); }
  @keyframes cardHit {
    0%   { transform: translateX(0) rotate(0deg); }
    15%  { transform: translateX(18px) rotate(2.5deg); }
    30%  { transform: translateX(-14px) rotate(-2deg); }
    45%  { transform: translateX(10px) rotate(1.4deg); }
    60%  { transform: translateX(-7px) rotate(-1deg); }
    78%  { transform: translateX(4px) rotate(0.5deg); }
    100% { transform: translateX(0) rotate(0deg); }
  }

  /* 屏幕震动 */
  body.shaking { animation: screenShake 0.6s cubic-bezier(.36,.07,.19,.97); }
  @keyframes screenShake {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    10% { transform: translate(-10px, 5px) rotate(-0.5deg); }
    25% { transform: translate(9px, -6px) rotate(0.5deg); }
    40% { transform: translate(-7px, 4px) rotate(-0.3deg); }
    55% { transform: translate(6px, -3px) rotate(0.3deg); }
    70% { transform: translate(-4px, 2px) rotate(-0.2deg); }
    85% { transform: translate(2px, -1px) rotate(0.1deg); }
  }

  @media (max-width: 600px) {
    .title { font-size: 30px; }
    .clock-bar { flex-direction: column; gap: 6px; padding: 14px; }
    .card { min-width: 100%; }
    .toolbar { top: 8px; right: 8px; gap: 5px; opacity: 0.6; }
    .toolbar .btn { font-size: 11px; padding: 5px 9px; }
    .kun-charge .kun-figure { font-size: 44px; }
    .kun-charge .kun-shout { font-size: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-basketball, .title { animation: none; }
    body.shaking { animation: none; }
  }
</style>
</head>
<body>

<!-- 飘落的篮球背景 -->
<div id="basketballs"></div>

<div class="container">
  <div class="title" id="mainTitle" title="点我五下有惊喜">🏀 坤时转换器 🕐</div>
  <div class="subtitle">小黑子的专属计时器 · 距离下班的每一秒都在「坤」之中</div>

  <!-- 当前时间 -->
  <div class="clock-bar">
    <span class="label">📍 现在时刻</span>
    <span class="time" id="nowTime">--:--</span>
    <span class="sec" id="nowSec">:--</span>
    <span class="date" id="nowDate"></span>
  </div>

  <!-- 工具按钮（右上角悬浮） -->
  <div class="toolbar">
    <button class="btn btn-ghost" id="kunBtn" title="给屏幕来一下铁山靠（快捷键 K）">🏀 铁山靠</button>
    <button class="btn btn-ghost" id="soundBtn" title="音效开关">🔊</button>
    <button class="btn btn-ghost" id="resetBtn" title="恢复默认（我 17:30 / 熊老师 18:00）">↺ 默认</button>
    <button class="btn btn-primary" id="openSettings" title="自定义人物信息">⚙️ 设置</button>
  </div>

  <!-- 人物卡片（由 JS 渲染） -->
  <div class="cards" id="cards"></div>

  <div class="footer-joke" id="jokeText">「你离下班还有很久，但你离坤时很近。」</div>

  <!-- 换算公式 -->
  <div class="formula-box">
    📐 <b>换算公式</b>：1 坤时 = <b id="ratioText">2.5</b> 小时<br>
    💡 坤时 = 距离下班秒数 ÷ <b id="ratioSecText">9000</b>（即 2.5×3600）<br>
    🎤 坤时越大，说明你离「鸡你太美」越近（不是）<br>
    🖱️ 点击页面任意处 <b>弹篮球</b>　·　按 <b>K</b> 或点右上角 <b>铁山靠</b> 给屏幕来一下
  </div>
</div>

<!-- 设置弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h2>⚙️ 自定义人物信息</h2>
    <div class="desc">设置昵称、头像、上下班时间等，配置会保存在本机浏览器（localStorage），刷新不丢失。</div>

    <div id="personList"></div>
    <button class="btn btn-add" id="addPerson">＋ 添加一位打工人</button>

    <div class="field" style="margin-top:18px;">
      <div class="col">
        <label>🕐 1 坤时 = 多少小时</label>
        <input type="number" id="kunRatio" min="0.1" max="24" step="0.1">
      </div>
      <div class="col">
        <label>🎨 默认配色（新增人物时使用）</label>
        <select id="defaultTheme"></select>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost left" id="exportBtn">⬇️ 导出配置</button>
      <button class="btn btn-ghost" id="importBtn">⬆️ 导入配置</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button class="btn btn-danger" id="resetInside">恢复默认</button>
      <button class="btn btn-ghost" id="cancelBtn">取消</button>
      <button class="btn btn-primary" id="saveBtn">💾 保存并应用</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<canvas class="confetti" id="confetti"></canvas>

<datalist id="emojiOptions">
  <option value="🧑‍💻"></option><option value="🐻"></option><option value="🐔"></option>
  <option value="🏀"></option><option value="👩‍💻"></option><option value="🧔"></option>
  <option value="🐱"></option><option value="🐶"></option><option value="🦊"></option>
  <option value="🐼"></option><option value="🦁"></option><option value="🐸"></option>
  <option value="👑"></option><option value="🎤"></option><option value="💜"></option>
  <option value="🔥"></option><option value="🌙"></option><option value="☕"></option>
</datalist>

<script>
// ====== 默认配置 ======
const STORAGE_KEY = 'kun-time-config-v1';
const SOUND_KEY = 'kun-time-sound';

const THEMES = {
  slate : { name:'石墨灰', from:'#2d3436', to:'#636e72', glow:'rgba(99,110,114,0.45)',  count:'#55efc4', bar:['#00b894','#55efc4'] },
  tomato: { name:'番茄红', from:'#b33939', to:'#e17055', glow:'rgba(227,112,85,0.45)',  count:'#ffeaa7', bar:['#d63031','#fdcb6e'] },
  violet: { name:'紫罗兰', from:'#5f27cd', to:'#a55eea', glow:'rgba(165,94,234,0.45)',  count:'#ffeaa7', bar:['#8854d0','#a55eea'] },
  forest: { name:'森林绿', from:'#0b7a4b', to:'#3ddc97', glow:'rgba(61,220,151,0.4)',   count:'#eaffea', bar:['#0b7a4b','#3ddc97'] },
  ocean : { name:'深海蓝', from:'#0a3d62', to:'#3dc1d3', glow:'rgba(61,193,211,0.4)',   count:'#c7f9ff', bar:['#0a3d62','#3dc1d3'] },
  gold  : { name:'土豪金', from:'#8a6d1f', to:'#f7b731', glow:'rgba(247,183,49,0.4)',   count:'#fff3c4', bar:['#e1b12c','#f7b731'] },
  pink  : { name:'樱花粉', from:'#b5325f', to:'#ff9ff3', glow:'rgba(255,159,243,0.4)',  count:'#fff0fb', bar:['#b5325f','#ff9ff3'] }
};

function defaultConfig() {
  return {
    kunRatio: 2.5,
    defaultTheme: 'slate',
    people: [
      { id: uid(), emoji:'🧑‍💻', name:'我',     tag:'卑微打工人', start:'09:00', off:'17:30', theme:'slate'  },
      { id: uid(), emoji:'🐻',   name:'熊老师', tag:'卷王本王',   start:'09:00', off:'18:00', theme:'tomato' }
    ]
  };
}

function uid() { return 'p_' + Math.random().toString(36).slice(2, 9); }

// ====== 配置读写 ======
let config = loadConfig();

function loadConfig() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultConfig();
    const parsed = JSON.parse(raw);
    return normalize(parsed);
  } catch (e) {
    return defaultConfig();
  }
}
function saveConfig() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
}
function normalize(cfg) {
  const base = defaultConfig();
  if (!cfg || typeof cfg !== 'object') return base;
  const ratio = parseFloat(cfg.kunRatio);
  const people = Array.isArray(cfg.people) ? cfg.people : base.people;
  return {
    kunRatio: isFinite(ratio) && ratio > 0 ? Math.min(24, ratio) : base.kunRatio,
    defaultTheme: THEMES[cfg.defaultTheme] ? cfg.defaultTheme : base.defaultTheme,
    people: people.map((p, i) => ({
      id: p && p.id ? p.id : uid(),
      emoji: (p && p.emoji) ? String(p.emoji).slice(0, 4) : '🧑‍💻',
      name: (p && p.name) ? String(p.name).trim() : ('打工人' + (i + 1)),
      tag: (p && p.tag) ? String(p.tag).trim() : '',
      start: validTime(p && p.start) ? p.start : '09:00',
      off: validTime(p && p.off) ? p.off : '18:00',
      theme: THEMES[p && p.theme] ? p.theme : (Object.keys(THEMES)[i % Object.keys(THEMES).length])
    }))
  };
}
function validTime(t) { return typeof t === 'string' && /^\d{2}:\d{2}$/.test(t); }

// ====== 工具函数 ======
function pad(n) { return n < 10 ? '0' + n : n; }
function toSec(hhmm) { const [h, m] = hhmm.split(':').map(Number); return h * 3600 + m * 60; }
function formatCountdown(t) {
  t = Math.max(0, Math.floor(t));
  return `${pad(Math.floor(t / 3600))}:${pad(Math.floor((t % 3600) / 60))}:${pad(t % 60)}`;
}
function clamp(n) { return Math.min(100, Math.max(0, n)); }

// 计算剩余秒数与所处状态
function getState(startSec, offSec, cur) {
  const crossNight = offSec <= startSec;         // 下班时间在上班时间之前 => 跨夜班次
  if (crossNight) {
    if (cur >= startSec) return { left: offSec + 86400 - cur, working: true,  before: false };
    if (cur < offSec)    return { left: offSec - cur,          working: true,  before: false };
    return { left: 0, working: false, before: false };          // 处于休息时段
  }
  if (cur < startSec)    return { left: offSec - cur, working: true,  before: true };  // 还没上班
  if (cur >= offSec)     return { left: 0, working: false, before: false };            // 已下班
  return { left: offSec - cur, working: true, before: false };
}

// 今日工作进度
function getProgress(startSec, offSec, cur) {
  const crossNight = offSec <= startSec;
  const offN = crossNight ? offSec + 86400 : offSec;
  let elapsed = cur - startSec;
  if (crossNight && elapsed < 0) elapsed += 86400;
  if (!crossNight && elapsed < 0) elapsed = 0;
  return clamp((elapsed / (offN - startSec)) * 100);
}

// ====== 🆕 音效（WebAudio 合成，零外部资源） ======
let audioCtx = null;
let soundOn = localStorage.getItem(SOUND_KEY) !== 'off';

function ac() {
  if (!soundOn) return null;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (e) { return null; }
}

function tone(opts) {
  const { freq = 440, dur = 0.15, type = 'sine', vol = 0.07, slideTo = null, delay = 0 } = opts;
  const ctx = ac();
  if (!ctx) return;
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(Math.max(20, freq), t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.06);
}

const sfx = {
  tieShanKao() {
    tone({ freq: 320, dur: 0.18, type: 'sawtooth', vol: 0.05, slideTo: 70 });
    tone({ freq: 880, dur: 0.10, type: 'square',   vol: 0.035, slideTo: 220, delay: 0.16 });
    tone({ freq: 140, dur: 0.28, type: 'triangle', vol: 0.07, slideTo: 55,  delay: 0.22 });
  },
  bounce() {
    tone({ freq: 200, dur: 0.09, type: 'sine', vol: 0.05, slideTo: 95 });
  },
  celebrate() {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
      tone({ freq: f, dur: 0.26, type: 'triangle', vol: 0.06, delay: i * 0.09 }));
    tone({ freq: 261.63, dur: 0.5, type: 'sine', vol: 0.045, delay: 0.36 });
  },
  milestone() {
    tone({ freq: 660, dur: 0.12, type: 'square', vol: 0.04 });
    tone({ freq: 990, dur: 0.14, type: 'square', vol: 0.035, delay: 0.10 });
  }
};

let kunCharging = false;

function tieShanKao() {
  if (kunCharging) return;
  kunCharging = true;

  // 1. 屏幕震动
  document.body.classList.remove('shaking');
  void document.body.offsetWidth;
  document.body.classList.add('shaking');

  // 2. 坤坤冲锋
  const el = document.createElement('div');
  el.className = 'kun-charge';

  document.body.appendChild(el);

  sfx.tieShanKao();

  // 3. 卡片挨个被撞飞
  const cards = Array.from(document.querySelectorAll('.card'));
  cards.forEach((card, i) => {
    setTimeout(() => {
      card.classList.remove('hit');
      void card.offsetWidth;
      card.classList.add('hit');
    }, 150 + i * 110);
    setTimeout(() => card.classList.remove('hit'), 1100 + i * 110);
  });

  // 4. 沿途弹出篮球
  for (let i = 0; i < 10; i++) {
    setTimeout(() => {
      popBasketball(
        window.innerWidth * (0.15 + Math.random() * 0.7),
        window.innerHeight * (0.4 + Math.random() * 0.35)

    }, 200 + i * 70);
  }

  // 5. 收尾
  setTimeout(() => {
    el.remove();
    document.body.classList.remove('shaking');
    kunCharging = false;
  }, 1500);
}

// ====== 每秒更新 ======
function update() {
  const now = new Date();
  const cur = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

  document.getElementById('nowTime').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  document.getElementById('nowSec').textContent = `:${pad(now.getSeconds())}`;
  document.getElementById('nowDate').textContent =
    `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} 周${'日一二三四五六'[now.getDay()]}`;

  const KUN_SEC = config.kunRatio * 3600;
  let minLeft = Infinity;

  config.people.forEach(p => {
    const r = refs[p.id];
    if (!r) return;
    const startSec = toSec(p.start), offSec = toSec(p.off);
    const st = getState(startSec, offSec, cur);

    if (st.working && st.left > 0) {
      const kunVal = st.left / KUN_SEC;

      r.countdown.textContent = formatCountdown(st.left);
      r.kun.textContent = kunVal.toFixed(4);
      r.kun.style.color = '#ff9ff3';
      r.label.textContent = `⏳ 距离${p.name}下班还有`;
      r.status.textContent = st.before
        ? '😪 还没到上班时间，别急着数坤时'
        : statusText(st.left, p.name);
      r.progress.style.width = (st.before ? 0 : getProgress(startSec, offSec, cur)) + '%';
      r.kunHint.textContent = `≈ ${(st.left / 3600).toFixed(2)} 小时`;
      if (st.left < minLeft) minLeft = st.left;

      // 🆕 跨越整坤时里程碑 —— 来一场小篮球雨
      const prev = prevKunMap[p.id];
      if (typeof prev === 'number' && prev > kunVal) {
        if (Math.floor(kunVal + 1e-9) < Math.floor(prev + 1e-9)) {
          const ts = Date.now();
          if (ts - lastMilestoneAt > 1500) {
            lastMilestoneAt = ts;
            basketballRain(14);
            sfx.milestone();
          }
        }
      }
      prevKunMap[p.id] = kunVal;
      offState[p.id] = false;
    } else {
      r.countdown.innerHTML = '<div class="after-work">🎉 已下班！</div>';
      r.kun.textContent = '0.0000';
      r.kun.style.color = '#55efc4';
      r.label.textContent = '✅ 坤时已清零';
      r.status.textContent = `🏀 ${p.name}下班了！鸡你太美～`;
      r.progress.style.width = '100%';
      r.kunHint.textContent = '自由啦！';
      prevKunMap[p.id] = 0;
      if (!offState[p.id]) {
        offState[p.id] = true;
        fireConfetti();
        basketballRain(18);
        sfx.celebrate();
      }
    }
  });

  updateJoke(minLeft);

  // 标签页标题同步
  if (minLeft === Infinity) document.title = '🎉 全员已下班 · 坤时转换器';
  else document.title = `🕐 ${formatCountdown(minLeft)} · 坤时转换器`;
}

function statusText(left, name) {
  if (left > 3 * 3600) return '😴 坤时漫长，摸鱼是正道';
  if (left > 3600)     return '☕ 坤时已过大半，撑住！';
  if (left > 1800)     return '📦 坤时余额不足一半！';
  if (left > 300)      return '🔥 最后冲刺！坤时即将归零！';
  return `🏃 ${name}收拾东西！准备溜！`;
}

function updateJoke(minLeft) {
  const jokeEl = document.getElementById('jokeText');
  let pool;
  if (minLeft === Infinity)      { pool = jokes.off;  jokeEl.classList.add('highlight'); }
  else if (minLeft < 1800)       { pool = jokes.near; jokeEl.classList.remove('highlight'); }
  else if (minLeft < 4 * 3600)   { pool = jokes.mid;  jokeEl.classList.remove('highlight'); }
  else                           { pool = jokes.far;  jokeEl.classList.remove('highlight'); }

  const idx = Math.floor(Date.now() / 10000) % pool.length;
  if (jokeEl.textContent !== pool[idx]) {
    jokeEl.style.opacity = '0';
    setTimeout(() => { jokeEl.textContent = pool[idx]; jokeEl.style.opacity = '1'; }, 300);
  }
}

// ====== 彩带效果 ======
const confettiCanvas = document.getElementById('confetti');
const ctx = confettiCanvas.getContext('2d');
let particles = [];
function resizeCanvas() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function fireConfetti() {
  for (let i = 0; i < 120; i++) {
    particles.push({
      x: Math.random() * confettiCanvas.width,
      y: Math.random() * confettiCanvas.height - confettiCanvas.height,
      w: Math.random() * 8 + 4,
      h: Math.random() * 8 + 4,
      color: ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#55efc4'][Math.floor(Math.random() * 6)],
      vx: Math.random() * 4 - 2,
      vy: Math.random() * 3 + 2,
      rot: Math.random() * 360,
      vr: Math.random() * 10 - 5
    });
  }
}
function animateConfetti() {
  ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  particles = particles.filter(p => p.y < confettiCanvas.height);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot * Math.PI / 180);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  });
  requestAnimationFrame(animateConfetti);
}
animateConfetti();

  }
});

document.getElementById('kunRatio').addEventListener('input', e => {
  const v = parseFloat(e.target.value);
  draft.kunRatio = isFinite(v) && v > 0 ? Math.min(24, v) : draft.kunRatio;
});
document.getElementById('defaultTheme').addEventListener('change', e => { draft.defaultTheme = e.target.value; });

document.getElementById('saveBtn').addEventListener('click', () => {
  draft.people = draft.people.map((p, i) => ({
    id: p.id || uid(),
    emoji: (p.emoji || '🧑‍💻').slice(0, 4),
    name: (p.name || '').trim() || ('打工人' + (i + 1)),
    tag: (p.tag || '').trim(),
    start: validTime(p.start) ? p.start : '09:00',
    off: validTime(p.off) ? p.off : '18:00',
    theme: THEMES[p.theme] ? p.theme : 'slate'
  }));
  config = normalize(draft);
  saveConfig();
  offState = {};
  prevKunMap = {};
  renderCards();
  update();
  closeModal();
  toast('✅ 已保存并应用');
});

document.getElementById('resetInside').addEventListener('click', () => { resetDefault(); });
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('确定恢复为默认配置（我 17:30 / 熊老师 18:00）吗？')) resetDefault();
});

function resetDefault() {
  config = defaultConfig();
  saveConfig();
  offState = {};
  prevKunMap = {};
  renderCards();
  update();
  closeModal();
  toast('↺ 已恢复默认配置');
}

// 导出 / 导入
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kun-time-config.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('⬇️ 配置已导出');
});
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const cfg = normalize(JSON.parse(reader.result));
      draft.people = cfg.people;
      draft.kunRatio = cfg.kunRatio;
      draft.defaultTheme = cfg.defaultTheme;
      document.getElementById('kunRatio').value = draft.kunRatio;
      document.getElementById('defaultTheme').value = draft.defaultTheme;
      renderPersonList();
      toast('⬆️ 已导入，点「保存并应用」生效');
    } catch (err) {
      toast('❌ 文件格式不正确');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

// ====== 🆕 交互绑定 ======
// 点击页面弹篮球（避开按钮 / 输入框 / 弹窗遮罩）
document.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  if (e.target.closest('button, input, select, textarea, a, label, .modal-mask, .toast')) return;
  popBasketball(e.clientX, e.clientY);
}, { passive: true });

// 铁山靠按钮
document.getElementById('kunBtn').addEventListener('click', tieShanKao);

// 标题连点 5 次 → 铁山靠
let titleClicks = 0, titleTimer = null;
document.getElementById('mainTitle').addEventListener('click', () => {
  titleClicks++;
  clearTimeout(titleTimer);
  titleTimer = setTimeout(() => { titleClicks = 0; }, 900);
  if (titleClicks >= 5) {
    titleClicks = 0;
    tieShanKao();
    toast('🎤 只因你太美～');
  }
});

// 音效开关
const soundBtn = document.getElementById('soundBtn');
function refreshSoundBtn() {
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  soundBtn.title = soundOn ? '音效已开启（点击关闭）' : '音效已关闭（点击开启）';
}
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off');
  refreshSoundBtn();
  if (soundOn) sfx.bounce();
});
refreshSoundBtn();

// ====== 启动 ======
renderCards();
update();
setInterval(update, 1000);
</script>
</body>
</html>
